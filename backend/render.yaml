# Render Blueprint for AI-Prof Backend
# https://render.com/docs/blueprint

services:
  # FastAPI Web Service
  - type: web
    name: ai-prof-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromGroup: ai-prof-db
      - key: REDIS_URL
        fromGroup: ai-prof-redis
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: VOICE_PROVIDER
        value: simulated

  # Celery Background Worker
  - type: worker
    name: ai-prof-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.queue_worker.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromGroup: ai-prof-db
      - key: REDIS_URL
        fromGroup: ai-prof-redis
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: ai-prof-db
    databaseName: outreach_platform
    user: platform_user
    plan: starter

redis:
  - name: ai-prof-redis
    plan: Starter
